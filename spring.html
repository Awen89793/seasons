        <div class="container">

                <h1>春：在昨日的春天等待你</h1>
                <div class="tag">时间倒流 / 回滚</div>
                
                <div class="cover-section">
                    <!-- 修改了这里 -->
                    <img src="covers/Spring.webp" alt="在昨日的春天等待你 封面">
                    <a href="#" class="download-btn">获取书籍</a>

                <section>
                    <h2>剧情简介</h2>
                    <p>因为一次交通事故失去了妹妹的“我”，在妹妹的旧手机里发现了一段录音。通过这段录音，“我”回到了事故发生之前的那个春天。为了拯救妹妹，我必须在时间不断倒流的循环中，寻找改变命运的那个瞬间。</p>
                </section>

                <section>
                    <h2>经典台词</h2>
                    <blockquote>“如果明天就要失去一切，你是否还会选择在那天遇见她？”</blockquote>
                </section>

                <section>
                    <h2>时空法则</h2>
                    <ul>
                        <li>时间的回滚并非无限的，每次重置都会消耗记忆。</li>
                        <li>只有“我”保留了之前的记忆，其他人都被重置了。</li>
                        <li>必须找到触发事件的关键物品，才能跳出循环。</li>
                    </ul>
                </section>
            </div>
