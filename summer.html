                <h1>夏：通往夏天的隧道，再见的出口</h1>
                <div class="tag">时间加速 / 浦岛效应</div>
                
                <section>
                    <h2>剧情简介</h2>
                    <p>在乡下的废墟中，塔野薰发现了一条通往异次元的隧道。传言说，只要进入这条隧道，就能得到自己最想要的东西。为了找回意外去世的妹妹，他和渴望离开这座小镇的同学花城杏子一起，踏入了那条充满未知与代价的隧道。</p>
                </section>

                <section>
                    <h2>经典台词</h2>
                    <blockquote>“我失去的东西，一定能在这个夏天的尽头重新取回。”</blockquote>
                </section>

                <section>
                    <h2>时空法则</h2>
                    <ul>
                        <li>进入隧道的人，每度过1小时，外界就会过去数分钟。</li>
                        <li>隧道内是停滞的空间，但外界时间流逝得极快。</li>
                        <li>许愿的代价，是必须留在隧道所在的“夏天”。</li>
                    </ul>
                </section>
