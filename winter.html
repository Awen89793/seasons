        <div class="container">
            <div class="page-card">
                <h1>冬：永冬无境，幻梦残墟</h1>
                <div class="tag">时间循环</div>
                
                <section>
                    <h2>剧情简介</h2>
                    <p>在一个被永冬覆盖的废墟城市里，少女每天都在重复着同样的早晨。为了打破这个永无止境的寒冬轮回，她必须找出这个世界的“出口”。在一次次失败的尝试中，她逐渐发现，这个循环是为了保护某个人而存在的。</p>
                </section>

                <section>
                    <h2>经典台词</h2>
                    <blockquote>“哪怕是无尽的冬日，只要有你，我就有走出轮回的勇气。”</blockquote>
                </section>

                <section>
                    <h2>时空法则</h2>
                    <ul>
                        <li>整个世界被锁定在冬季的某一天，无法迎来春天。</li>
                        <li>打破循环的关键，在于弥补过去的一个遗憾。</li>
                        <li>循环内的记忆在每次重启后都会消失，只有主角保留。</li>
                    </ul>
                </section>
            </div>
        </div>
