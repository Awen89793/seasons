        <div class="container">
            <div class="page-card">
                <h1>秋：琥珀之秋，0秒之旅</h1>
                <div class="tag">时间停止</div>
                
                <section>
                    <h2>剧情简介</h2>
                    <p>因为家庭变故而想要逃离现实的少年，偶然获得了一块能让时间停止的怀表。在时间静止的“琥珀之秋”里，他遇到了同样被困在时间里的少女。两人一起度过了一段只属于他们的、漫长的0秒。</p>
                </section>

                <section>
                    <h2>经典台词</h2>
                    <blockquote>“在这静止的琥珀之中，我们得以拥有永恒。”</blockquote>
                </section>

                <section>
                    <h2>时空法则</h2>
                    <ul>
                        <li>在时间静止的世界里，只有使用者和接触了怀表的人能活动。</li>
                        <li>时间恢复流动时，所有静止的事物会瞬间复原。</li>
                        <li>过度使用怀表会透支使用者的生命力。</li>
                    </ul>
                </section>
            </div>
        </div>
